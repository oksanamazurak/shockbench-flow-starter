# config.yaml for the mpc agent's structural search (forecast_open + hybrid criterion only)
max_iterations: 20
checkpoint_interval: 5
random_seed: 42
log_level: "INFO"

llm:
  provider: "claude_code"
  models:
    - name: "sonnet"
      weight: 1
      max_tokens: 160000
      max_budget_usd: 1
      timeout: 180

evaluator:
  timeout: 300
  cascade_evaluation: false
  parallel_evaluations: 1

max_code_length: 60000 # agent.py is ~41KB
